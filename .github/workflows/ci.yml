name: Future-Proof CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Repository quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js when package metadata exists
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python when Python metadata exists
        if: ${{ hashFiles('pyproject.toml', 'requirements*.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository quality gate
        shell: bash
        run: ./.github/scripts/ci/run-checks.sh
